[versions]
kotlin = "2.4.20" # https://github.com/JetBrains/kotlin/releases
gson = "2.14.0" # https://github.com/google/gson/releases
mockk = "1.14.11" # https://github.com/mockk/mockk/releases
junit = "6.1.3" # https://github.com/junit-team/junit-framework/releases
pluginPublish = "2.2.1" # https://plugins.gradle.org/plugin/com.gradle.plugin-publish

[libraries]
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins] # Find IDs at https://plugins.gradle.org
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish" }