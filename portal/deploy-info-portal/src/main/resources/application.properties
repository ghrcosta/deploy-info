# suppress inspection "UnusedProperty" for whole file
spring.application.name=deploy-info-portal

# App Engine standard routes requests to the application on the port from the PORT environment
# variable (8080 on the Java runtimes) — the placeholder keeps 8080 as the local default.
server.port=${PORT:8080}

# See: documentation/backend/deployment-cleanup.md
deploy-info.cleanup.interval=PT15M
deploy-info.cleanup.grace-period=PT10M

# See: documentation/backend/authentication.md
deploy-info.auth.enabled=false
deploy-info.auth.client-id=
deploy-info.auth.collector-require-email-match=true

