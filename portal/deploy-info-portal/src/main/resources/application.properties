# suppress inspection "UnusedProperty" for whole file
spring.application.name=deploy-info-portal

# App Engine standard routes requests to the application on the port from the PORT environment
# variable (8080 on the Java runtimes) — the placeholder keeps 8080 as the local default.
server.port=${PORT:8080}

# Validity/cleanup sweep, triggered on tree requests when due (a fixed scheduler does not fit App
# Engine Standard, where idle instances are terminated). enabled: whether the on-request trigger is
# active. interval: minimum time between completed sweeps (concurrent sweeps from multiple
# instances are accepted as redundant — every delete is idempotent). grace-period: minimum link age
# before the sweep may judge it stale. All keys are always present so every profile has a complete
# deploy-info property set.
deploy-info.cleanup.enabled=false
deploy-info.cleanup.interval=PT15M
deploy-info.cleanup.grace-period=PT10M

# Authentication: requests to the API must present a Google token of a user who is present in the
# IAM of the project the portal runs in — directly or through a group (group membership is expanded
# with the Cloud Asset API's AnalyzeIamPolicy, which requires the portal's service account to have
# cloudasset.assets.analyzeIamPolicy on the project, e.g. via roles/cloudasset.viewer). See
# portal/deploy-info-portal/documentation/authentication.md. Disabled by default; the prod profile
# enables it.
deploy-info.auth.enabled=false
# The OAuth client id the frontend's Google Identity Services sign-in issues ID tokens for — the
# audience the portal verifies on those tokens. Only meaningful when auth is enabled; the portal
# refuses to start with auth enabled and this blank.
deploy-info.auth.client-id=
# Whether the collector trigger's userEmail must equal the email of the access token it presents.
# In the standard flow both derive from the same active gcloud account, so they always match and
# the check never fires for a real collector run. Its only purpose is defense in depth against
# hand-crafted requests: a client presenting a valid token of an IAM-permitted account A while
# claiming a different userEmail could otherwise have its upload folder linked to another user's
# deploy identity (hijacking the link and misattributing the collected files). The check costs
# nothing — the token email is already returned by the tokeninfo verification. It is configurable
# because gcloud service-account impersonation setups
# (`gcloud config set auth/impersonate_service_account`) produce a token whose email is the
# service account while userEmail may report the user, which would false-positive on every deploy —
# such environments should set this to false.
deploy-info.auth.collector-require-email-match=true

