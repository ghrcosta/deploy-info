# suppress inspection "UnusedProperty" for whole file
spring.application.name=deploy-info-portal

# Validity/cleanup sweep, triggered on tree requests when due (a fixed scheduler does not fit App
# Engine Standard, where idle instances are terminated). enabled: whether the on-request trigger is
# active. interval: minimum time between completed sweeps (concurrent sweeps from multiple
# instances are accepted as redundant — every delete is idempotent). grace-period: minimum link age
# before the sweep may judge it stale. All keys are always present so every profile has a complete
# deploy-info property set.
deploy-info.cleanup.enabled=false
deploy-info.cleanup.interval=PT15M
deploy-info.cleanup.grace-period=PT10M

# CORS origins allowed to call the API cross-origin — the local dev pairing of the UI (4200) and
# the backend (8080). An empty list disables CORS processing entirely, which is what the
# same-origin production serving needs (UI built into the same jar): browsers send an Origin
# header even on same-origin non-GET requests, and any request with an unlisted origin would be
# rejected. Comma-separated list.
deploy-info.cors.allowed-origins=http://localhost:4200
