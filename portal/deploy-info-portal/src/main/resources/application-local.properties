# suppress inspection "UnusedProperty" for whole file
spring.cloud.gcp.datastore.emulator.enabled=true
spring.cloud.gcp.datastore.emulator.port=8090

deploy-info.storage-bucket=<TODO_ADD_YOUR_CLOUD_STORAGE_BUCKET_HERE>
deploy-info.linking.window=PT15M

spring.cloud.gcp.datastore.emulator.firestore-in-datastore-mode=true

# The local dev pairing of the UI (4200) and the backend (8080); semantics: DeployInfoProperties.Cors.
deploy-info.cors.allowed-origins=http://localhost:4200

deploy-info.cleanup.enabled=false

deploy-info.auth.enabled=false
deploy-info.auth.client-id=
deploy-info.auth.collector-require-email-match=true
