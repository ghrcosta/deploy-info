# suppress inspection "UnusedProperty" for whole file
spring.cloud.gcp.datastore.emulator.enabled=true
spring.cloud.gcp.datastore.emulator.port=8090

deploy-info.storage-bucket=deploy-info-uploads-local
deploy-info.linking.window=PT15M

spring.cloud.gcp.datastore.emulator.firestore-in-datastore-mode=true

# CORS origins allowed to call the API cross-origin — the local dev pairing of the UI (4200) and
# the backend (8080). Comma-separated list; an empty value disables CORS processing entirely
# (no CORS mapping is registered at all), which is what the same-origin production serving needs.
deploy-info.cors.allowed-origins=http://localhost:4200

# Authentication is disabled for the local run: there is no Google sign-in without a configured
# OAuth client, and the local backend usually has no service account to run the Cloud Asset
# analysis with. To exercise authentication locally, create an OAuth client id (web application,
# authorized JavaScript origin http://localhost:4200), grant your account any role on the portal's
# GCP project, then run the backend with
#   deploy-info.auth.enabled=true -D... (or an env/properties override)
# plus deploy-info.auth.client-id=<client id> and the GOOGLE_CLOUD_PROJECT environment variable
# set to the portal's project id (the App Engine runtime sets it automatically; locally it must be
# provided by hand).
deploy-info.auth.enabled=true
deploy-info.auth.client-id=295504594990-77nnddk5lbmvh0h1ajdpfh9tmfgp1epf.apps.googleusercontent.com
deploy-info.auth.collector-require-email-match=true
