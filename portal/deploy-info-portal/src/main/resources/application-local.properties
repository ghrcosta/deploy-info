# suppress inspection "UnusedProperty" for whole file
spring.cloud.gcp.datastore.emulator.enabled=true
spring.cloud.gcp.datastore.emulator.port=8090

deploy-info.storage-bucket=deploy-info-uploads-local
deploy-info.linking.window=PT15M

spring.cloud.gcp.datastore.emulator.firestore-in-datastore-mode=true

# CORS origins allowed to call the API cross-origin — the local dev pairing of the UI (4200) and
# the backend (8080). Comma-separated list; an empty value disables CORS processing entirely
# (no CORS mapping is registered at all), which is what the same-origin production serving needs.
deploy-info.cors.allowed-origins=http://localhost:4200
