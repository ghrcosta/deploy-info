# suppress inspection "UnusedProperty" for whole file
spring.application.name=deploy-info-portal

# GCP integrations are not used by the tests: the Storage client is only resolved lazily when a
# folder is actually deleted (never in tests), and Datastore is replaced by test doubles (mocks),
# so no real GCP credentials, emulator, or internet access is ever needed.
# Remove the Storage exclusion once the portal actually uses Cloud Storage (Phase 1).
spring.autoconfigure.exclude=\
  com.google.cloud.spring.autoconfigure.storage.GcpStorageAutoConfiguration,\
  com.google.cloud.spring.autoconfigure.datastore.GcpDatastoreAutoConfiguration,\
  com.google.cloud.spring.autoconfigure.datastore.DatastoreTransactionManagerAutoConfiguration

deploy-info.storage-bucket=deploy-info-uploads-test
deploy-info.linking.window=PT15M

# The local dev pairing (UI 4200 → backend 8080), so the CORS behavior tests exercise a configured
# mapping. Comma-separated list; an empty value disables CORS processing entirely (no CORS mapping
# is registered at all).
deploy-info.cors.allowed-origins=http://localhost:4200

