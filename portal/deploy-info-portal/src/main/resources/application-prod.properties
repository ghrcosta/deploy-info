# suppress inspection "UnusedProperty" for whole file

deploy-info.storage-bucket=deploy-info-uploads
deploy-info.linking.window=PT15M

# CORS is intentionally disabled: the key is present with an empty value (profile property files
# only override keys they define, so the key must exist here — otherwise it would leak in from
# another properties file). An empty origin list means no CORS mapping is registered at all, which
# is what the same-origin production serving needs (UI built into the same jar): browsers send an
# Origin header even on same-origin non-GET requests, and any request carrying an unlisted origin
# would be rejected. Add `deploy-info.cors.allowed-origins=<url>` here only if the UI is ever
# served from another origin.
deploy-info.cors.allowed-origins=

# Authentication is enabled in production: every API request must present a Google token of a user
# present in the IAM of the portal's project (directly or through a group) — see
# documentation/authentication.md. The client id must be set to the OAuth client (web application)
# whose authorized JavaScript origins include the portal's serving URL.
deploy-info.auth.enabled=true
deploy-info.auth.client-id=295504594990-77nnddk5lbmvh0h1ajdpfh9tmfgp1epf.apps.googleusercontent.com
deploy-info.auth.collector-require-email-match=true
