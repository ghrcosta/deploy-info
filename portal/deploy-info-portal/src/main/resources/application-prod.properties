# suppress inspection "UnusedProperty" for whole file

deploy-info.storage-bucket=deploy-info-uploads
deploy-info.linking.window=PT15M

# CORS is intentionally not configured (empty origin list = disabled): the UI is built into this
# same deploy, so its requests are same-origin — yet browsers still send an Origin header on
# non-GET requests, and any request carrying an unlisted origin would be rejected. Add
# `deploy-info.cors.allowed-origins=<url>` here only if the UI is ever served from another origin.
