[versions] # Use Spring Initializr (https://start.spring.io) to generate a project, use the versions set there
kotlin = "2.4.20" # See Spring Initializr
appengineGradlePlugin = "2.8.7" # https://github.com/GoogleCloudPlatform/appengine-plugins/releases (app-gradle-plugin)
googleCloudAppengineAdmin = "2.99.0" # Aligned with the gax 2.87.0 / grpc 1.83.1 stack managed by Spring Cloud GCP 8.2.x BOM
googleCloudRun = "0.93.0" # Aligned with the gax 2.87.0 / grpc 1.83.1 stack managed by Spring Cloud GCP 8.2.x BOM
mockito = "5.24.0" # Use max(5.24.0, version supported by [mockitoKotlin]) -- agent required by Java 21
mockitoKotlin = "6.4.0" # https://github.com/mockito/mockito-kotlin/releases
spring-boot = "4.1.1" # See Spring Initializr
spring-dependencyManagement = "1.1.7" # See Spring Initializr
spring-cloud = "2025.1.3" # See Spring Initializr
spring-cloud-gcp = "8.2.1" # See Spring Initializr

[libraries]
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc-test" }
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
spring-cloud-bom = { group = "org.springframework.cloud", name = "spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-gcp-bom = { group = "com.google.cloud", name = "spring-cloud-gcp-dependencies", version.ref = "spring-cloud-gcp" }
spring-cloud-gcp-starter = { group = "com.google.cloud", name = "spring-cloud-gcp-starter" }
spring-cloud-gcp-starter-datastore = { group = "com.google.cloud", name = "spring-cloud-gcp-starter-data-datastore" }
spring-cloud-gcp-starter-logging = { group = "com.google.cloud", name = "spring-cloud-gcp-starter-logging" }
spring-cloud-gcp-starter-storage = { group = "com.google.cloud", name = "spring-cloud-gcp-starter-storage" }
jackson-kotlin = { group = "tools.jackson.module", name = "jackson-module-kotlin" }
junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

google-cloud-appengine-admin = { group = "com.google.cloud", name = "google-cloud-appengine-admin", version.ref = "googleCloudAppengineAdmin" }
google-cloud-run = { group = "com.google.cloud", name = "google-cloud-run", version.ref = "googleCloudRun" }

[plugins] # Find IDs at https://plugins.gradle.org
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependencyManagement = { id = "io.spring.dependency-management", version.ref = "spring-dependencyManagement" }
google-appengine = { id = "com.google.cloud.tools.appengine", version.ref = "appengineGradlePlugin" }