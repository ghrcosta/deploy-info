<!-- Shell layout of the mock (viewer.html): a 320px navigator column next to a
     fluid viewer column; the structural .shell grid styles (including the
     mobile drawer) live in src/sass/_structure.scss. The id lets the top bar's
     mobile menu toggle point at the navigator (aria-controls). -->
<div class="shell">
    <aside class="navigator" id="navigator">
        <deploy-navigator></deploy-navigator>
    </aside>
    <main class="viewer">
        <file-viewer></file-viewer>
    </main>
</div>
