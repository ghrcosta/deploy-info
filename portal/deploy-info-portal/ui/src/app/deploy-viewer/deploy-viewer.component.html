@if (tree !== null) {
    <div class="shell">
        <aside class="navigator" id="navigator">
            <deploy-navigator [tree]="tree"></deploy-navigator>
        </aside>
        <main class="viewer">
            <file-viewer></file-viewer>
        </main>
    </div>
} @else {
    <div class="shell-loading">
        <mat-spinner [diameter]="26"></mat-spinner>
    </div>
}
