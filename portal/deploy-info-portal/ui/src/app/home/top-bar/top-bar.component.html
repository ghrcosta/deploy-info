<header class="topbar">
    <button class="icon-btn nav-toggle" type="button" aria-label="Toggle navigator" aria-controls="navigator"
            (click)="toggleNavigator()">
        <mat-icon>menu</mat-icon>
    </button>

    <a class="brand" href="" (click)="openView('deployments', $event)">
        <span class="brand-mark"><mat-icon svgIcon="deployed_code"></mat-icon></span>
        <span class="brand-name">DeployInfo</span>
    </a>

    <nav class="topbar-nav" aria-label="Main navigation">
        <a class="topbar-link" [class.active]="view === 'deployments'" href="" (click)="openView('deployments', $event)">Deployments</a>
        <a class="topbar-link" [class.active]="view === 'projects'" href="" (click)="openView('projects', $event)">Projects</a>
        <a class="topbar-link topbar-help" [class.active]="view === 'help'" href="" (click)="openView('help', $event)">Help</a>
    </nav>

    <div class="topbar-actions">
        <button class="icon-btn" type="button" aria-label="Toggle theme" (click)="toggleDarkMode()">
            @if (isDarkMode) {
                <mat-icon>light_mode</mat-icon>
            } @else {
                <mat-icon>dark_mode</mat-icon>
            }
        </button>
        <button class="icon-btn" type="button" aria-label="Sign out" (click)="logout()">
            <mat-icon>logout</mat-icon>
        </button>
    </div>
</header>
